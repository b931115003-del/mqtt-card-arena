<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MQTT 4人即時元素競技場 (同桌鎖定版)</title>
<script src="https://unpkg.com/mqtt@5.3.5/dist/mqtt.min.js"></script>
<style>
  body { font-family: 'Segoe UI', sans-serif; background: #1a2639; color: #fff; text-align: center; margin: 0; padding: 15px; }
  .header { margin-bottom: 12px; }
  .status-bar { background: #2c3e50; padding: 6px 14px; border-radius: 20px; display: inline-block; font-size: 13px; }
  .top-bar { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-bottom: 15px; }
  input { padding: 8px 10px; border-radius: 6px; border: none; font-size: 14px; }
  .table { display: grid; grid-template-areas: ". top ." "left center right" ". bottom ."; gap: 10px; max-width: 680px; margin: 15px auto; background: #276749; padding: 20px; border-radius: 20px; border: 6px solid #5c3a21; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  .seat { background: rgba(0,0,0,0.35); padding: 10px; border-radius: 12px; min-height: 115px; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; }
  .seat-1 { grid-area: bottom; border: 2px solid #ecc94b; }
  .seat-2 { grid-area: right; }
  .seat-3 { grid-area: top; }
  .seat-4 { grid-area: left; }
  .center-zone { grid-area: center; background: rgba(255,255,255,0.12); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; justify-content: center; min-width: 145px; }
  .card-slot { width: 52px; height: 74px; background: #edf2f7; color: #1a202c; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 26px; margin-top: 6px; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
  .card-back { background: repeating-linear-gradient(45deg, #c53030, #c53030 8px, #9b2c2c 8px, #9b2c2c 16px); color: transparent; }
  .controls { margin-top: 15px; }
  button { background: #3182ce; color: white; border: none; padding: 8px 12px; font-size: 13px; border-radius: 8px; cursor: pointer; margin: 2px; transition: 0.2s; }
  button:hover:not(:disabled) { background: #2b6cb0; transform: translateY(-1px); }
  button:disabled { background: #718096; cursor: not-allowed; opacity: 0.6; }
  .btn-kick { background: #e53e3e; font-size: 11px; padding: 3px 8px; margin-top: 6px; border-radius: 4px; }
  .btn-kick:hover { background: #c53030; }
  .btn-bot { background: #805ad5; }
  .btn-bot:hover { background: #6b46c1; }
  .btn-invite { background: #38a169; font-weight: bold; }
  .btn-invite:hover { background: #2f855a; }
  .btn-switch { background: #dd6b20; }
  .btn-switch:hover { background: #c05621; }
  .btn-clear { background: #718096; }
  .btn-clear:hover { background: #4a5568; }
  .card-btn { font-size: 22px; padding: 12px 20px; background: #2d3748; border: 2px solid #4a5568; }
  .card-btn:hover:not(:disabled) { border-color: #ecc94b; background: #4a5568; }
  .score-badge { background: #d69e2e; color: #1a202c; padding: 2px 7px; border-radius: 10px; font-size: 12px; font-weight: bold; margin-left: 4px; }
  .leaderboard { max-width: 680px; margin: 15px auto; background: rgba(0,0,0,0.25); padding: 12px; border-radius: 12px; font-size: 14px; }
  .hint-box { font-size: 12px; color: #fbd38d; margin-bottom: 10px; }
  @media (max-width: 600px) {
    .table { padding: 12px; gap: 6px; }
    .seat { padding: 6px; min-height: 105px; font-size: 13px; }
    .center-zone { padding: 8px; min-width: 110px; font-size: 13px; }
  }
</style>
</head>
<body>

<div class="header">
  <h2 style="margin:5px 0;">⚔️ MQTT 4人元素競技場</h2>
  <div class="status-bar" id="connStatus">🟡 準備連線至伺服器...</div>
</div>

<div class="hint-box">💡 跨設備同桌：請先點「🔗 複製邀請連結」傳給手機或朋友，或雙方輸入相同的「包廂代號」與連上同一台雲端伺服器</div>

<div class="top-bar">
  <input type="text" id="playerName" placeholder="輸入暱稱" style="width:90px;">
  <input type="text" id="roomId" placeholder="包廂代號" style="width:90px;">
  <button onclick="joinRoom(true)">進入包廂</button>
  <button class="btn-invite" onclick="copyInviteLink()">🔗 複製邀請連結</button>
  <button class="btn-switch" onclick="switchBroker()">🔄 切換伺服器</button>
  <button class="btn-bot" onclick="addBot()">🤖 +電腦陪練</button>
  <button class="btn-clear" onclick="clearTable()">🧹 清空整桌</button>
</div>

<div class="table">
  <div class="seat seat-3" id="seat-3"><div>北家 (空位)</div><button onclick="takeSeat(3)">入座</button></div>
  <div class="seat seat-4" id="seat-4"><div>西家 (空位)</div><button onclick="takeSeat(4)">入座</button></div>
  <div class="center-zone">
    <div id="roundDisplay" style="font-weight:bold; color:#fbd38d;">第 1 局 (等2人入座)</div>
    <div id="resultDisplay" style="margin-top:6px; line-height:1.4;"></div>
    <button id="nextRoundBtn" onclick="nextRound()" style="display:none; margin-top:8px; background:#d69e2e; color:#1a202c; font-weight:bold;">下一局</button>
  </div>
  <div class="seat seat-2" id="seat-2"><div>東家 (空位)</div><button onclick="takeSeat(2)">入座</button></div>
  <div class="seat seat-1" id="seat-1"><div>南家 (空位)</div><button onclick="takeSeat(1)">入座</button></div>
</div>

<div class="controls" id="handControls" style="display:none;">
  <p style="margin:5px 0; font-size:14px;">選擇出牌（🔥剋🌪️，🌪️剋💧，💧剋🔥）：</p>
  <button class="card-btn" onclick="playCard('🔥')">🔥 火</button>
  <button class="card-btn" onclick="playCard('🌪️')">🌪️ 風</button>
  <button class="card-btn" onclick="playCard('💧')">💧 水</button>
</div>

<div class="leaderboard" id="leaderboard">
  <strong>🏆 即時戰績排行榜：</strong> <span id="rankText">尚無對戰紀錄</span>
</div>

<script>
  let client = null;
  let isConnected = false;
  let connectTimer = null;
  const userId = 'u_' + Math.random().toString(36).substr(2, 6);
  let mySeat = null;
  let myName = '';
  let room = '';
  let currentRound = 1;
  let seatsData = { 1: null, 2: null, 3: null, 4: null };
  let roundPlays = {};
  let isRevealed = false;
  let scores = { 1: 0, 2: 0, 3: 0, 4: 0 };

  const BROKERS = [
    { name: 'EMQX雲端', url: 'wss://broker.emqx.io:8084/mqtt' },
    { name: 'HiveMQ雲端', url: 'wss://broker.hivemq.com:8884/mqtt' },
    { name: 'Mosquitto雲端', url: 'wss://test.mosquitto.org:8081/mqtt' }
  ];
  let brokerIndex = 0;
  let isBrokerLocked = false; // 若透過邀請連結進來，鎖定與房主同一台伺服器

  document.getElementById('playerName').value = '高手_' + Math.floor(Math.random() * 900 + 100);

  const urlParams = new URLSearchParams(window.location.search);
  const invitedRoom = urlParams.get('room');
  const invitedBroker = urlParams.get('b');
  if (invitedBroker !== null && BROKERS[parseInt(invitedBroker)]) {
    brokerIndex = parseInt(invitedBroker);
    isBrokerLocked = true;
  }
  if (invitedRoom) {
    document.getElementById('roomId').value = invitedRoom;
  } else {
    document.getElementById('roomId').value = 'VIP_' + Math.floor(1000 + Math.random() * 9000);
  }

  function switchBroker() {
    isBrokerLocked = false;
    brokerIndex = (brokerIndex + 1) % BROKERS.length;
    joinRoom(true);
  }

  function copyInviteLink() {
    const currentRoom = document.getElementById('roomId').value.trim();
    const inviteUrl = `${window.location.origin}${window.location.pathname}?room=${encodeURIComponent(currentRoom)}&b=${brokerIndex}`;
    
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(inviteUrl).then(() => {
        alert(`✅ 已複製專屬包廂 [${currentRoom}] (${BROKERS[brokerIndex].name}) 邀請連結！\n\n傳給手機或朋友直接點開即可同桌：\n${inviteUrl}`);
      }).catch(() => {
        prompt('請複製以下邀請連結傳給朋友：', inviteUrl);
      });
    } else {
      prompt('請複製以下邀請連結傳給朋友：', inviteUrl);
    }
  }

  function clearTable() {
    if (!isConnected) return;
    if (!confirm('確定要清空整張牌桌（踢除所有座位並重置牌局）嗎？')) return;
    mySeat = null;
    document.getElementById('handControls').style.display = 'none';
    for (let i = 1; i <= 4; i++) {
      client.publish(`gemini/mqttgame3/${room}/seat/${i}`, '', { qos: 1, retain: true });
      client.publish(`gemini/mqttgame3/${room}/play/${currentRound}/${i}`, '', { qos: 1, retain: true });
    }
    client.publish(`gemini/mqttgame3/${room}/next`, '', { qos: 1, retain: true });
  }

  function bindClientEvents(mqttClient, currentBroker) {
    mqttClient.on('connect', () => {
      if (connectTimer) clearTimeout(connectTimer);
      isConnected = true;
      document.getElementById('connStatus').innerText = `🟢 已連線 (${currentBroker.name}) | 包廂: ${room}`;
      mqttClient.subscribe(`gemini/mqttgame3/${room}/#`);
      
      if (mySeat) {
        const seatTopic = `gemini/mqttgame3/${room}/seat/${mySeat}`;
        mqttClient.publish(seatTopic, JSON.stringify({ id: userId, name: myName, isBot: false }), { qos: 1, retain: true });
      }
    });

    mqttClient.on('reconnect', () => {
      document.getElementById('connStatus').innerText = `🟡 網路波動，重新連回 ${currentBroker.name}...`;
    });

    mqttClient.on('message', (topic, message) => {
      const payload = message.toString();
      
      if (topic.includes('/seat/')) {
        const seatNum = topic.split('/').pop();
        const parsed = payload ? JSON.parse(payload) : null;
        
        if (!parsed && mySeat == seatNum && isConnected) {
          const seatTopic = `gemini/mqttgame3/${room}/seat/${mySeat}`;
          mqttClient.publish(seatTopic, JSON.stringify({ id: userId, name: myName, isBot: false }), { qos: 1, retain: true });
          return;
        }

        seatsData[seatNum] = parsed;
        if (!parsed) {
          scores[seatNum] = 0;
          delete roundPlays[seatNum];
          if (mySeat == seatNum) {
            mySeat = null;
            document.getElementById('handControls').style.display = 'none';
          }
        }
        checkRoundEnd();
        renderTable();
      }
      
      if (topic.includes('/play/')) {
        const parts = topic.split('/');
        const round = parseInt(parts[parts.length - 2]);
        const seatNum = parts[parts.length - 1];
        if (round === currentRound) {
          if (payload) {
            roundPlays[seatNum] = JSON.parse(payload).card;
          } else {
            delete roundPlays[seatNum];
          }
          checkRoundEnd();
          renderTable();
        }
      }

      if (topic.endsWith('/next')) {
        if (!payload) return;
        const data = JSON.parse(payload);
        if (data.round > currentRound) {
          currentRound = data.round;
          roundPlays = {};
          isRevealed = false;
          document.getElementById('resultDisplay').innerHTML = '';
          document.getElementById('nextRoundBtn').style.display = 'none';
          enableCards(true);
          renderTable();
          triggerBotsPlay();
        }
      }
    });
  }

  function joinRoom(isManualAction = false) {
    if (connectTimer) clearTimeout(connectTimer);
    if (client) {
      try { client.end(true); } catch(e) {}
    }
    isConnected = false;
    mySeat = null;
    seatsData = { 1: null, 2: null, 3: null, 4: null };
    roundPlays = {};
    scores = { 1: 0, 2: 0, 3: 0, 4: 0 };
    isRevealed = false;
    currentRound = 1;
    document.getElementById('handControls').style.display = 'none';
    document.getElementById('resultDisplay').innerHTML = '';
    document.getElementById('nextRoundBtn').style.display = 'none';
    renderTable();
    
    room = document.getElementById('roomId').value.trim() || ('VIP_' + Math.floor(1000 + Math.random() * 9000));
    document.getElementById('roomId').value = room;
    
    const currentBroker = BROKERS[brokerIndex];
    const newUrl = `${window.location.pathname}?room=${encodeURIComponent(room)}&b=${brokerIndex}`;
    window.history.replaceState({}, '', newUrl);

    document.getElementById('connStatus').innerText = `🟡 連線至 [${currentBroker.name}] 包廂 [${room}] 中...`;
    
    client = mqtt.connect(currentBroker.url, {
      clientId: userId + '_' + Math.floor(Math.random()*100),
      clean: true,
      keepalive: 30,
      reconnectPeriod: isBrokerLocked ? 2000 : 0
    });

    bindClientEvents(client, currentBroker);

    // 只有在「非邀請連結鎖定狀態」下，4秒連不上才自動換伺服器，避免跟房主失散
    if (!isBrokerLocked) {
      connectTimer = setTimeout(() => {
        if (!isConnected) {
          brokerIndex = (brokerIndex + 1) % BROKERS.length;
          document.getElementById('connStatus').innerText = `🟠 ${currentBroker.name} 繁忙，自動切換備援伺服器...`;
          setTimeout(() => joinRoom(false), 400);
        }
      }, 4000);
    }
  }

  function takeSeat(seatNum) {
    if (!isConnected) {
      alert('請等上方出現「🟢 已連線」後再點選入座！');
      return;
    }
    if (mySeat) {
      alert('你已經在座位上了！');
      return;
    }
    myName = document.getElementById('playerName').value.trim() || '無名氏';
    mySeat = seatNum;
    const seatTopic = `gemini/mqttgame3/${room}/seat/${seatNum}`;
    
    client.publish(seatTopic, JSON.stringify({ id: userId, name: myName, isBot: false }), { qos: 1, retain: true });
    document.getElementById('handControls').style.display = 'block';
    enableCards(true);
    renderTable();
  }

  function kickSeat(seatNum) {
    if (!isConnected) return;
    if (seatNum == mySeat) {
      mySeat = null;
      document.getElementById('handControls').style.display = 'none';
    }
    const seatTopic = `gemini/mqttgame3/${room}/seat/${seatNum}`;
    client.publish(seatTopic, '', { qos: 1, retain: true });
    client.publish(`gemini/mqttgame3/${room}/play/${currentRound}/${seatNum}`, '', { qos: 1, retain: true });
  }

  function addBot() {
    if (!isConnected) {
      alert('請等上方顯示「🟢 已連線」後再加入電腦陪練！');
      return;
    }
    const emptySeat = [1, 2, 3, 4].find(s => !seatsData[s]);
    if (!emptySeat) {
      alert('牌桌已經滿座囉！');
      return;
    }
    const botNames = ['機器人Alpha', '機器人Beta', '機器人Gamma', 'AI棋王'];
    const botName = botNames[emptySeat - 1];
    const seatTopic = `gemini/mqttgame3/${room}/seat/${emptySeat}`;
    client.publish(seatTopic, JSON.stringify({ id: 'bot_' + emptySeat, name: botName, isBot: true }), { qos: 1, retain: true });
    
    setTimeout(() => {
      if (!isRevealed && !roundPlays[emptySeat]) {
        const cards = ['🔥', '🌪️', '💧'];
        const pick = cards[Math.floor(Math.random() * cards.length)];
        client.publish(`gemini/mqttgame3/${room}/play/${currentRound}/${emptySeat}`, JSON.stringify({ card: pick }), { qos: 1, retain: true });
      }
    }, 800);
  }

  function triggerBotsPlay() {
    [1, 2, 3, 4].forEach(s => {
      if (seatsData[s] && seatsData[s].isBot) {
        setTimeout(() => {
          if (!isRevealed && !roundPlays[s]) {
            const cards = ['🔥', '🌪️', '💧'];
            const pick = cards[Math.floor(Math.random() * cards.length)];
            client.publish(`gemini/mqttgame3/${room}/play/${currentRound}/${s}`, JSON.stringify({ card: pick }), { qos: 1, retain: true });
          }
        }, 600 + s * 300);
      }
    });
  }

  function playCard(card) {
    if (!mySeat || roundPlays[mySeat]) return;
    enableCards(false);
    const seatTopic = `gemini/mqttgame3/${room}/seat/${mySeat}`;
    client.publish(seatTopic, JSON.stringify({ id: userId, name: myName, isBot: false }), { qos: 1, retain: true });
    
    const playTopic = `gemini/mqttgame3/${room}/play/${currentRound}/${mySeat}`;
    client.publish(playTopic, JSON.stringify({ card: card }), { qos: 1, retain: true });
  }

  function checkRoundEnd() {
    const activeSeats = Object.keys(seatsData).filter(s => seatsData[s] !== null);
    const playedSeats = activeSeats.filter(s => roundPlays[s] !== undefined);
    
    if (activeSeats.length >= 2 && playedSeats.length === activeSeats.length) {
      if (!isRevealed) {
        isRevealed = true;
        calculateWinner(activeSeats);
        document.getElementById('nextRoundBtn').style.display = 'inline-block';
      }
    }
  }

  function calculateWinner(activeSeats) {
    const posShort = { 1: '南', 2: '東', 3: '北', 4: '西' };
    const cards = activeSeats.map(s => roundPlays[s]);
    const uniqueCards = [...new Set(cards)];
    const detailText = activeSeats.map(s => `${posShort[s]}${roundPlays[s]}`).join(' ');
    let msg = '';

    if (uniqueCards.length === 1 || uniqueCards.length === 3) {
      msg = `🤝 平手！<br><span style="font-size:12px; color:#e2e8f0;">(${detailText})</span>`;
    } else {
      const winMap = { '🔥': '🌪️', '🌪️': '💧', '💧': '🔥' };
      const [c1, c2] = uniqueCards;
      const winningCard = winMap[c1] === c2 ? c1 : c2;
      const winnerSeats = activeSeats.filter(s => roundPlays[s] === winningCard);
      winnerSeats.forEach(s => { scores[s] = (scores[s] || 0) + 1; });
      const winners = winnerSeats.map(s => seatsData[s].name);
      msg = `🏆 勝：${winningCard} (${winners.join(', ')})<br><span style="font-size:12px; color:#e2e8f0;">[${detailText}]</span>`;
    }
    document.getElementById('resultDisplay').innerHTML = msg;
  }

  function nextRound() {
    const nextR = currentRound + 1;
    [1, 2, 3, 4].forEach(s => {
      client.publish(`gemini/mqttgame3/${room}/play/${currentRound}/${s}`, '', { qos: 1, retain: true });
    });
    client.publish(`gemini/mqttgame3/${room}/next`, JSON.stringify({ round: nextR }), { qos: 1, retain: true });
  }

  function enableCards(enable) {
    document.querySelectorAll('.card-btn').forEach(btn => btn.disabled = !enable);
  }

  function renderTable() {
    const posNames = { 1: '南家', 2: '東家', 3: '北家', 4: '西家' };
    let activeCount = 0;
    let rankList = [];

    for (let i = 1; i <= 4; i++) {
      const el = document.getElementById(`seat-${i}`);
      const player = seatsData[i];
      if (player) {
        activeCount++;
        rankList.push({ name: player.name, score: scores[i] || 0 });
        let cardHtml = '<div style="margin-top:8px; font-size:12px; color:#cbd5e0;">思考中...</div>';
        if (roundPlays[i]) {
          if (isRevealed || i == mySeat) {
            cardHtml = `<div class="card-slot">${roundPlays[i]}</div>`;
          } else {
            cardHtml = `<div class="card-slot card-back">蓋牌</div>`;
          }
        }
        const kickLabel = (i == mySeat) ? '離座' : '踢除';
        el.innerHTML = `
          <div><strong>${posNames[i]}</strong>: ${player.name}<span class="score-badge">${scores[i] || 0}勝</span></div>
          ${cardHtml}
          <button class="btn-kick" onclick="kickSeat(${i})">✖ ${kickLabel}</button>
        `;
      } else {
        el.innerHTML = `<div>${posNames[i]} (空位)</div>` + (!mySeat ? `<button onclick="takeSeat(${i})">入座</button>` : '');
      }
    }

    if (rankList.length > 0) {
      rankList.sort((a, b) => b.score - a.score);
      document.getElementById('rankText').innerText = rankList.map((r, idx) => `${idx === 0 && r.score > 0 ? '👑' : ''}${r.name} (${r.score}勝)`).join('  |  ');
    } else {
      document.getElementById('rankText').innerText = '尚無對戰紀錄';
    }

    if (activeCount < 2) {
      document.getElementById('roundDisplay').innerText = `第 ${currentRound} 局 (等2人入座)`;
    } else {
      document.getElementById('roundDisplay').innerText = isRevealed ? `第 ${currentRound} 局 開牌！` : `第 ${currentRound} 局 出牌中`;
    }
  }

  window.onload = () => {
    renderTable();
    joinRoom(false);
  };
</script>
</body>
</html>
